name: Regression suite

on:
  pull_request:
  push:
    branches:
      - main
      - rc_version_*
  workflow_dispatch:

concurrency:
  group: regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  jvm-quality-gate:
    name: JVM, lint, localization, coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run local regression gate
        run: ./gradlew :app:localRegressionGate --stacktrace
      - name: Upload JVM reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jvm-quality-reports
          if-no-files-found: ignore
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/reports/jacoco/

  android-matrix:
    name: Android API ${{ matrix.api-level }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [27, 35, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM access
        run: |
          sudo usermod -aG kvm "$USER"
          sudo chmod 666 /dev/kvm
      - name: Run complete instrumentation suite
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: default
          profile: pixel_2
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -camera-back none
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace
      - name: Capture device diagnostics after failure
        if: failure()
        run: |
          mkdir -p app/build/reports/device-diagnostics
          adb logcat -d > app/build/reports/device-diagnostics/logcat-api-${{ matrix.api-level }}.txt
          adb exec-out screencap -p > app/build/reports/device-diagnostics/screen-api-${{ matrix.api-level }}.png
      - name: Upload Android reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-api-${{ matrix.api-level }}-reports
          if-no-files-found: ignore
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/reports/device-diagnostics/
